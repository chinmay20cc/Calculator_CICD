name: Python Calculator CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # JOB 1: Test Calculator
  test:
    name: Test Calculator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q calculator.py test_calculator.py

      - name: Run unit tests
        run: |
          python -m unittest -v test_calculator.py


  # JOB 2: Deployment Demo
  deployment-demo:
    name: Deployment Demo
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify calculator
        run: |
          python -c "from calculator import add, subtract, multiply, divide; assert add(2, 3) == 5; assert subtract(5, 3) == 2; assert multiply(2, 3) == 6; assert divide(6, 3) == 2; print('Calculator verification successful')"

      - name: Prepare deployment package
        run: |
          python - <<'PY'
          from zipfile import ZipFile

          files = ["calculator.py", "readme.md"]

          with ZipFile("calculator-deployment.zip", "w") as archive:
              for filename in files:
                  archive.write(filename)

          print("Deployment package created successfully")
          PY

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-deployment
          path: calculator-deployment.zip
          if-no-files-found: error